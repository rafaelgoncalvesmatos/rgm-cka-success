apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-network-policy
  namespace: restricted
spec:
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          project: myproject
   # - podSelector:
   #     matchLabels:
   #       role: frontend
    ports:
    - protocol: TCP
      port: 80

